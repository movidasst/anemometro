name: Aplicar logo principal

on:
  push:
    paths:
      - '.github/workflows/aplicar-logo-principal.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar logo oficial de www.movidasst.com
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 'https://www.movidasst.com/logo-oficial-movida-sst-plus.png' -o assets/logo-movida-sst-plus.png
          if [ -d dist ]; then mkdir -p dist/assets; cp assets/logo-movida-sst-plus.png dist/assets/logo-movida-sst-plus.png; fi
      - name: Cambiar solo referencias del logo
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'assets/logo-movida-sst-plus.svg':'assets/logo-movida-sst-plus.png',
            'logo-movida-sst-plus.svg':'assets/logo-movida-sst-plus.png',
            'logo.svg':'assets/logo-movida-sst-plus.png',
            'https://laboratorio.movidasst.com/assets/logo-movida-sst-plus.png':'assets/logo-movida-sst-plus.png',
            'https://drive.google.com/uc?export=view&id=1IlAvUr0cP6LtILZobFlKRYO6aCKW26aH':'assets/logo-movida-sst-plus.png'
          }
          style='''\n<style id="movida-logo-2026">\nimg[src*="logo-movida-sst-plus"]{object-fit:contain!important;object-position:center!important;border-radius:50%!important;filter:drop-shadow(0 7px 12px rgba(0,32,91,.35))!important}\n.login-brand img{width:86px!important;height:86px!important}\n.brand img,.brand-mark{width:62px!important;height:62px!important}\n</style>\n'''
          for name in ['index.html','dist/index.html']:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              for a,b in replacements.items(): t=t.replace(a,b)
              if 'id="movida-logo-2026"' not in t and '</head>' in t: t=t.replace('</head>',style+'</head>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Guardar y retirar workflow temporal
        run: |
          git config user.name 'David Linares'
          git config user.email 'gdochile@gmail.com'
          git rm .github/workflows/aplicar-logo-principal.yml
          git add -A
          git commit -m 'Usa el mismo logo de www.movidasst.com en Anemómetro'
          git push
